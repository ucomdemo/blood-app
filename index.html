<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>我的血壓紀錄</title>
    <script>
      (() => {
        let theme = "light";
        let error = "";

        try {
          const savedTheme = localStorage.getItem("daily-blood-pressure-theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          } else if (savedTheme !== null) {
            error = "invalid";
          }
        } catch {
          error = "read";
        }

        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#111827" : "#f6f7fb";
        window.themeInitialization = { theme, error };
      })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="theme-controls">
        <svg class="theme-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 2v2M10 16v2M18 10h-2M4 10H2m13.66-5.66-1.42 1.42M5.76 14.24l-1.42 1.42m11.32 0-1.42-1.42M5.76 5.76 4.34 4.34" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>
        </svg>
        <input class="theme-switch" id="theme-toggle" type="checkbox" role="switch" aria-labelledby="theme-toggle-label">
        <svg class="theme-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M16.2 12.2A7 7 0 0 1 7.8 3.8 7 7 0 1 0 16.2 12.2Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>
        </svg>
        <label class="theme-label" id="theme-toggle-label" for="theme-toggle">深色模式</label>
        <span class="theme-value" id="theme-value">淺色</span>
      </div>
      <p class="theme-message" id="theme-message" role="status" aria-live="polite"></p>

      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3.5S6.5 14 6.5 20.2a9.5 9.5 0 0 0 19 0C25.5 14 16 3.5 16 3.5Z" fill="currentColor"/>
            <path d="M11 20.5c.3 2.8 2.2 4.5 4.8 4.8" stroke="#fff" stroke-linecap="round" stroke-width="1.8"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">MY DAILY HEALTH</p>
          <h1>我的血壓紀錄</h1>
          <p class="page-subtitle">簡單記下每一天的測量與用藥</p>
        </div>
      </header>

      <section class="form-card" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">NEW ENTRY</p>
            <h2 id="form-title">新增一筆紀錄</h2>
          </div>
          <span class="date-badge" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <rect x="3" y="5" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6.5 3.5v3M13.5 3.5v3M3 8.5h14" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>
            </svg>
            儲存時記錄時間
          </span>
        </div>

        <form id="record-form" novalidate>
          <div class="measurement-grid">
            <div class="field">
              <label for="systolic">收縮壓 <span class="unit">mmHg</span></label>
              <input id="systolic" name="systolic" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 120" aria-describedby="systolic-error" required>
              <p class="field-error" id="systolic-error"></p>
            </div>
            <div class="field">
              <label for="diastolic">舒張壓 <span class="unit">mmHg</span></label>
              <input id="diastolic" name="diastolic" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 80" aria-describedby="diastolic-error" required>
              <p class="field-error" id="diastolic-error"></p>
            </div>
            <div class="field">
              <label for="pulse">脈搏 <span class="unit">次／分鐘</span></label>
              <input id="pulse" name="pulse" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 72" aria-describedby="pulse-error" required>
              <p class="field-error" id="pulse-error"></p>
            </div>
          </div>

          <div class="details-grid">
            <div class="field">
              <label for="medication">用藥</label>
              <select id="medication" name="medication">
                <option value="無">無</option>
                <option value="已服藥">已服藥</option>
                <option value="未服藥">未服藥</option>
              </select>
            </div>
            <div class="field">
              <label for="notes">備註 <span class="optional">選填</span></label>
              <input id="notes" name="notes" type="text" maxlength="200" placeholder="例如：早餐後">
            </div>
          </div>

          <div class="form-footer">
            <p class="privacy-note">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 8V5.8a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/>
              </svg>
              紀錄只儲存在這個裝置
            </p>
            <button class="save-button" type="submit">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
              </svg>
              儲存紀錄
            </button>
          </div>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="records-section" aria-labelledby="records-title">
        <div class="records-heading">
          <div>
            <p class="eyebrow">YOUR HISTORY</p>
            <h2 id="records-title">測量紀錄 <span class="record-count" id="record-count">0</span></h2>
          </div>
          <p class="sort-note">最新紀錄在最上方</p>
        </div>
        <div class="records-list" id="records-list" aria-live="polite"></div>
      </section>

      <footer class="page-footer">為自己留一份日常紀錄</footer>
    </main>
  </body>
</html>
