<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>血壓管理 App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <h1>血壓管理 App</h1>
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="切換至深色主題"
          title="切換至深色主題"
        >
          <span class="theme-icon" aria-hidden="true">☾</span>
        </button>
      </header>

      <main class="content">
        <section class="card form-card">
          <h2>新增血壓紀錄</h2>
          <form id="bloodForm">
            <div class="form-grid">
              <label>
                <span>收縮壓 (mmHg)</span>
                <input type="number" id="systolic" min="0" max="300" placeholder="例如：120" required />
              </label>

              <label>
                <span>舒張壓 (mmHg)</span>
                <input type="number" id="diastolic" min="0" max="200" placeholder="例如：80" required />
              </label>

              <label>
                <span>脈搏 (bpm)</span>
                <input type="number" id="pulse" min="0" max="220" placeholder="例如：72" required />
              </label>

              <label>
                <span>藥物治療</span>
                <select id="medication" required>
                  <option value="">請選擇</option>
                  <option value="無">無</option>
                  <option value="已服藥">已服藥</option>
                  <option value="未服藥">未服藥</option>
                </select>
              </label>
            </div>

            <label class="full-width">
              <span>備註</span>
              <textarea id="notes" rows="3" placeholder="例如：早晨測量，感覺良好"></textarea>
            </label>

            <button type="submit">新增紀錄</button>
          </form>
        </section>

        <section class="card list-card">
          <div class="list-header">
            <h2>血壓紀錄清單</h2>
            <button id="clearAllBtn" class="secondary" type="button">清除全部</button>
          </div>
          <ul id="recordList" class="record-list"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
